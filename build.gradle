import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java'
    id 'war'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.10'
    id 'com.diffplug.spotless' version '8.9.0'
}

group = 'org.magnum.mobilecloud'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-jetty'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.security.oauth:spring-security-oauth2:2.5.2.RELEASE'
    implementation 'org.hsqldb:hsqldb'

    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'com.squareup.retrofit:retrofit:1.9.0'
    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    implementation 'com.squareup.okhttp:okhttp-urlconnection:2.7.5'
    implementation 'com.github.davidmarquis:fluent-interface-proxy:2.2.0'

    implementation files(
            'lib/mobilecloud.handin-1.0.0.jar',
            'lib/video.like.test-1.0.0.jar',
            'lib/autograder.handin-1.0.0.jar',
            'lib/autograder.spec-1.0.0.jar')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    spotbugs 'com.github.spotbugs:spotbugs:4.10.3'
    spotbugs 'org.apache.commons:commons-lang3:3.20.0'
}

springBoot {
    mainClass = 'org.magnum.mobilecloud.video.Application'
}

bootWar {
    archiveBaseName = 'gs-convert-jar-to-war'
}

test {
    useJUnit()
    exclude '**/integration/**'
    failOnNoDiscoveredTests = false
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = '7.14.0'
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
}

spotbugs {
    toolVersion = '4.9.8'
    effort = Effort.valueOf('DEFAULT')
    reportLevel = Confidence.valueOf('HIGH')
}

spotless {
    groovyGradle {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'yaml', {
        target '.github/**/*.yml', '.github/**/*.yaml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
